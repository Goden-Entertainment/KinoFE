<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Schedule – Kino Booking</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body class="dark-page">

<nav class="navbar">
  <div class="navbar-left">
    <button class="nav-btn" onclick="location.href='movies.html'">Movies</button>
    <button class="nav-btn" onclick="location.href='showings.html'">Showings</button>
    <button class="nav-btn">Contact</button>
  </div>
  <a class="navbar-brand" href="index.html">Kino Booking</a>
  <div class="navbar-right">
    <button class="nav-btn" id="authBtn">Sign in</button>
  </div>
</nav>

<div class="schedule-header">
  <h1>Movie Schedule</h1>
  <div class="week-nav">
    <button class="week-nav-btn" id="prevWeek">← Prev</button>
    <span class="week-range" id="weekRange"></span>
    <button class="week-nav-btn" id="nextWeek">Next →</button>
  </div>
</div>

<div class="week-grid" id="weekGrid"></div>

<!-- Movie info panel – appears below calendar when a showing is clicked -->
<div class="movie-info-panel" id="moviePanel">
  <img class="panel-poster" id="panelPoster" src="" alt="">
  <div class="panel-details">
    <p class="panel-title" id="panelTitle"></p>
    <p class="panel-meta" id="panelMeta"></p>
    <p class="panel-desc" id="panelDesc"></p>
    <button class="panel-buy-btn" id="panelBuyBtn">Buy Ticket</button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/showings.js"></script>
</body>
</html>
