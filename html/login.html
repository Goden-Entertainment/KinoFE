<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kino Booking – Sign in</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-page">
  <button class="login-cancel-top" onclick="history.back()">Cancel</button>

  <h1 class="login-logo">Kino<br>Booking</h1>

  <div class="form-card">
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email/Username</label>
        <input class="form-control" type="text" id="username" placeholder="Value" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Value" required>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Sign in</button>
        <button class="btn btn-danger" type="button" onclick="history.back()">Cancel</button>
      </div>

      <p class="error-msg" id="errorMsg"></p>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
