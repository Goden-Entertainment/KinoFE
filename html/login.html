<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kino Booking</title>
</head>

<body class="page page-login">



<div class="header-actions">
    <button class="btn btn-danger btn-header" type="button">Cancel</button>
</div>

<h1 class="page-title">
    <span>Kino</span>
    <span>Booking</span>
</h1>

<div class="form-card">
    <form id="KinoFE">

        <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-control"
                   type="text"
                   name="username"
                   id="username"
                   required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-control"
                   type="password"
                   name="password"
                   id="password"
                   required>
        </div>

        <div class="form-actions form-actions--stacked">
            <button class="btn btn-primary"
                    type="submit">Sign in</button>
            <button class="btn btn-danger"
                    type="button">Cancel</button>
        </div>

    </form>
</div>
<script src="../js/login.js"></script>

</body>


</html>
