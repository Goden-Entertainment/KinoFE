<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You – Kino Booking</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .top-bar { background: #1a2a3a; height: 80px; }
    .thank-section {
      background: #f9f9f4;
      background-image: radial-gradient(circle, #ccc 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .bag-icon { font-size: 3rem; margin-bottom: 16px; }
    .thank-heading {
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      margin: 0 0 16px;
      color: #111;
    }
    .thank-sub {
      font-size: 1.1rem;
      color: #444;
      font-family: Georgia, serif;
      margin: 0;
    }
    .bottom-bar { background: #1a2a3a; min-height: 40vh; }
    .home-link {
      display: inline-block;
      margin-top: 30px;
      background: #2A79C3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .home-link:hover { background: #1e61a0; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-left">
    <button class="nav-btn" onclick="location.href='movies.html'">Movies</button>
    <button class="nav-btn" onclick="location.href='showings.html'">Showings</button>
    <button class="nav-btn">Contact</button>
  </div>
  <a class="navbar-brand" href="index.html">Kino Booking</a>
  <div class="navbar-right">
    <button class="nav-btn" id="authBtn">Sign in</button>
  </div>
</nav>

<div class="top-bar"></div>

<div class="thank-section">
  <div class="bag-icon">🛍</div>
  <h1 class="thank-heading">Thank you!</h1>
  <p class="thank-sub">A confirmation has been sent to your email.</p>
  <a class="home-link" href="index.html">Back to home</a>
</div>

<div class="bottom-bar"></div>

<script src="../js/api.js"></script>
<script>initNav();</script>
</body>
</html>
