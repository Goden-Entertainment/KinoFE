<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin — Movies</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/adminMovie.css">

</head>
<body>
<form id="addMovieForm">
    <p>Create Movie</p>
    <label>Title</label>
    <input id="newTitle" type="text" required>

    <label>Age Limit</label>
    <input id="newAgeLimit" type="number" required>

    <label>Duration</label>
    <input id="newDuration" type="number" required>

    <label>Description</label>
    <input id="newDescription" type="text" required>

    <label>Status</label>
    <select id="newStatus">
        <option value="ACTIVE">Active</option>
        <option value="INACTIVE">Inactive</option>
        <option value="CANCELLED">cancelled</option>
        <option value="COMINGSOON">Coming Soon</option>
    </select>

    <label>Movie poster</label>
    <input type="file" name="img" id="img">

    <button type="button" id="addMovieBtn" class="btnPrimary">Create</button>

</form>

<!-- update movie form -->
<div id="updateMovieFormContainer">
    <form id="updateMovieForm">
        <input id="updateMovieId" type="hidden">
        <p>Update movie</p>
        <label>Title</label>
        <input id="updateTitle" type="text">

        <label>Age Limit</label>
        <input id="updateAgeLimit" type="number">

        <label>Duration</label>
        <input id="updateDuration" type="number">

        <label>Description</label>
        <input id="updateDescription" type="text">

        <label>Status</label>
        <select id="updateStatus">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
        </select>

        <button type="button" id="updateMovieBtn" class="btnPrimary">Update</button>
        <button type="button" onclick="document.getElementById('updateMovieFormContainer').style.display='none'">
            Cancel
        </button>
    </form>
</div>

<h1>Manage Movies</h1>
<table id="movieTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Age Limit</th>
        <th>Duration</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<script src="../js/adminMovie.js"></script>
</body>
</html>
